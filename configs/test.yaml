dataset:
  hdf5_path: datasets/door_push_pull.hdf5

  # Strictly use these HDF5 masks for all train/offline-val/online-val paths.
  prefer_hdf5_masks: true
  require_hdf5_masks: true
  train_mask: train
  val_mask: valid
  val_ratio: 0.1      # Used only when strict masks are disabled.
  split_seed: 42

  state_keys:
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
  camera_keys:
    - agentview_image
    - robot0_eye_in_hand_image
  force_keys:
    - robot0_eef_force

  history: 3
  action_horizon: 16
  action_dim: 7
  use_force: true

  image_size: 224
  model_image_size: 224
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]

model:
  architecture: cross_attn # no_force, cross_attn, force_adaln, fsra
  state_dim: 9
  force_dim: 3

  hidden_dim: 256
  num_layers: 8
  num_heads: 8

  # Vision encoder
  backbone_name: resnet18
  pretrained: true
  freeze_backbone: true

  # Optional model settings
  fourier_dim: 128
  frequency_scale: 1.0
  dropout: 0.0
  mlp_ratio: 4

  max_feature_height: 16
  max_feature_width: 16

training:
  seed: 42
  output_dir: checkpoints/open_door/adaln/opendoor_force

  batch_size: 64
  num_workers: 4

  max_steps: 25000
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_clip: 1.0

  log_interval: 10
  val_interval: 1000
  val_batches: 8
  save_interval: 1000

validation:
  max_batches: 20

  online_rollout: true
  rollout_interval: 2000
  rollout_episodes: 5
  rollout_seed: 104729
  rollout_video: true
  video_fps: 20

evaluation:
  sampling_steps: 20
  exec_horizon: 16
  max_episode_steps: 500
  success_hold_steps: 5
  require_model_file: true

wandb:
  enabled: true
  project: ForceVAM
  name: robomimic-adaln-opendoor-force
